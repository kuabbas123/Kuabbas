<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattani Dorms - หาหอพัก ม.อ.ปัตตานี</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Kanit) -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Header / Navbar -->
    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid font-bold text-2xl text-yellow-400 fa-building-user"></i>
                <span class="text-xl font-bold tracking-wide">Pattani<span class="text-yellow-400">Dorms</span></span>
            </div>
            <div class="text-sm font-light hidden sm:block">
                <i class="fa-solid fa-location-dot text-red-400 mr-1"></i> รวมหอพักรอบ ม.อ.ปัตตานี
            </div>
        </div>
    </header>

    <!-- Hero & Search Section -->
    <section class="bg-gradient-to-r from-blue-900 via-blue-800 to-indigo-900 text-white py-10 px-4">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-3xl sm:text-4xl font-bold mb-3">ค้นหาหอพักรอบ ม.อ.ปัตตานี</h1>
            <p class="text-blue-200 mb-6 font-light">ซอยหน้ามอ หลังมอ มะกรูด รูสะมิแล ค้นหาง่าย สบายกระเป๋า</p>
            
            <!-- Search & Filter Controls -->
            <div class="bg-white rounded-2xl p-4 shadow-xl text-slate-700 grid grid-cols-1 sm:grid-cols-3 gap-3">
                <!-- Search Input -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="text" id="searchInput" onkeyup="filterDorms()" placeholder="ค้นหาชื่อหอพัก หรือสถานที่..." class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>

                <!-- Zone Filter -->
                <div>
                    <select id="zoneFilter" onchange="filterDorms()" class="w-full py-2.5 px-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                        <option value="all">ทุกโซน / ทุกพื้นที่</option>
                        <option value="หน้ามอ">โซนหน้ามอ (เจริญประดิษฐ์)</option>
                        <option value="หลังมอ">โซนหลังมอ</option>
                        <option value="ถนนมะกรูด">โซนถนนมะกรูด</option>
                        <option value="รูสะมิแล">โซนรูสะมิแล</option>
                    </select>
                </div>

                <!-- Gender Filter -->
                <div>
                    <select id="genderFilter" onchange="filterDorms()" class="w-full py-2.5 px-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                        <option value="all">ประเภทหอพักทั้งหมด</option>
                        <option value="รวม">หอพักรวม</option>
                        <option value="หญิง">หอพักหญิงล้วน</option>
                        <option value="ชาย">หอพักชายล้วน</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content List Section -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-slate-800">รายการหอพัก (<span id="dormCount">0</span> แห่ง)</h2>
            <div class="text-xs text-gray-500">* ข้อมูลอัปเดตล่าสุดปี 2026</div>
        </div>

        <!-- Dorm Cards Grid -->
        <div id="dormGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Content Will Be Inserted Here -->
        </div>

        <!-- Empty State (When no dorms found) -->
        <div id="noResult" class="hidden text-center py-12">
            <i class="fa-solid fa-house-circle-xmark text-5xl text-gray-300 mb-3"></i>
            <p class="text-gray-500">ไม่พบหอพักที่ตรงกับเงื่อนไขการค้นหาของคุณ</p>
        </div>
    </main>

    <!-- Modal Detail Window -->
    <div id="dormModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="relative">
                <img id="modalImg" src="" alt="หอพัก" class="w-full h-56 object-cover rounded-t-2xl">
                <button onclick="closeModal()" class="absolute top-3 right-3 bg-black/50 text-white w-8 h-8 rounded-full hover:bg-black flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <span id="modalGenderBadge" class="absolute bottom-3 left-3 px-3 py-1 bg-blue-600 text-white text-xs rounded-full shadow"></span>
            </div>
            
            <div class="p-5">
                <h3 id="modalTitle" class="text-xl font-bold mb-1"></h3>
                <p id="modalZone" class="text-sm text-gray-500 mb-4"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i><span></span></p>

                <div class="bg-blue-50 p-3 rounded-xl mb-4 flex justify-between items-center">
                    <span class="text-sm text-blue-900 font-medium">ราคาเริ่มต้น</span>
                    <span id="modalPrice" class="text-lg font-bold text-blue-700"></span>
                </div>

                <h4 class="font-semibold text-sm mb-2 text-slate-700">สิ่งอำนวยความสะดวก</h4>
                <div id="modalFacilities" class="flex flex-wrap gap-2 mb-6">
                    <!-- Dynamic Badges -->
                </div>

                <div class="border-t pt-4 flex gap-3">
                    <a id="modalCall" href="#" class="flex-1 bg-green-600 hover:bg-green-700 text-white text-center py-2.5 rounded-xl text-sm font-medium transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-phone"></i> โทรติดต่อ
                    </a>
                    <a id="modalLine" href="#" target="_blank" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white text-center py-2.5 rounded-xl text-sm font-medium transition flex items-center justify-center gap-2">
                        <i class="fa-brands fa-line"></i> แชท Line
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Data and Logic -->
    <script>
        // Mock Data หอพักตัวอย่างในปัตตานี
        const dorms = [
            {
                id: 1,
                name: "หอพักสุขสบาย (เจริญประดิษฐ์ ซอย 5)",
                zone: "หน้ามอ",
                gender: "หญิง",
                price: "3,500 - 4,200",
                image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=600&q=80",
                facilities: ["แอร์", "เครื่องทำน้ำอุ่น", "Wi-Fi ฟรี", "กล้องวงจรปิด", "คีย์การ์ด"],
                phone: "0812345678",
                line: "https://line.me"
            },
            {
                id: 2,
                name: "กรีนเพลส หอพักนักศึกษา",
                zone: "หลังมอ",
                gender: "รวม",
                price: "2,800 - 3,500",
                image: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=600&q=80",
                facilities: ["พัดลม/แอร์", "ที่จอดรถมอเตอร์ไซค์", "เครื่องซักผ้าหยอดเหรียญ", "Wi-Fi"],
                phone: "0898765432",
                line: "https://line.me"
            },
            {
                id: 3,
                name: "เคพี เรสซิเดนซ์ ปัตตานี",
                zone: "ถนนมะกรูด",
                gender: "ชาย",
                price: "4,000 - 4,800",
                image: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=600&q=80",
                facilities: ["แอร์", "ตู้เย็น", "ลิฟต์", "ระบบรักษาความปลอดภัย 24 ชม.", "ที่จอดรถยนต์"],
                phone: "0823456789",
                line: "https://line.me"
            },
            {
                id: 4,
                name: "บ้านอนันต์ หอพักสตรี",
                zone: "รูสะมิแล",
                gender: "หญิง",
                price: "3,200 - 3,800",
                image: "https://images.unsplash.com/photo-1555854877-bab0e564b8d5?auto=format&fit=crop&w=600&q=80",
                facilities: ["แอร์", "เฟอร์นิเจอร์ครบ", "เงียบสงบ", "ใกล้ร้านอาหารฮาลาล"],
                phone: "0834567890",
                line: "https://line.me"
            }
        ];

        // Render Cards
        function renderDorms(items) {
            const grid = document.getElementById('dormGrid');
            const count = document.getElementById('dormCount');
            const noResult = document.getElementById('noResult');
            
            grid.innerHTML = '';
            count.innerText = items.length;

            if (items.length === 0) {
                noResult.classList.remove('hidden');
                return;
            } else {
                noResult.classList.add('hidden');
            }

            items.forEach(dorm => {
                const card = `
                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-lg transition duration-300 border border-slate-100 flex flex-col">
                        <div class="relative">
                            <img src="${dorm.image}" alt="${dorm.name}" class="w-full h-48 object-cover">
                            <span class="absolute top-3 right-3 px-2.5 py-1 text-xs font-semibold rounded-full ${
                                dorm.gender === 'หญิง' ? 'bg-pink-500 text-white' : 
                                dorm.gender === 'ชาย' ? 'bg-blue-500 text-white' : 'bg-purple-500 text-white'
                            }">หอ${dorm.gender}</span>
                            <span class="absolute bottom-3 left-3 bg-black/60 text-white text-xs px-2.5 py-1 rounded-md backdrop-blur-sm">
                                <i class="fa-solid fa-location-dot mr-1"></i>${dorm.zone}
                            </span>
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-slate-800 text-base mb-2 line-clamp-1">${dorm.name}</h3>
                                <div class="text-blue-700 font-semibold text-sm mb-3">
                                    ฿${dorm.price} <span class="text-xs text-gray-400 font-normal">/ เดือน</span>
                                </div>
                                <div class="flex flex-wrap gap-1.5 mb-4">
                                    ${dorm.facilities.slice(0, 3).map(f => `<span class="bg-slate-100 text-slate-600 text-[11px] px-2 py-0.5 rounded">${f}</span>`).join('')}
                                    ${dorm.facilities.length > 3 ? `<span class="bg-slate-100 text-slate-400 text-[11px] px-1.5 py-0.5 rounded">+${dorm.facilities.length - 3}</span>` : ''}
                                </div>
                            </div>
                            <button onclick="openModal(${dorm.id})" class="w-full bg-slate-900 hover:bg-blue-900 text-white text-xs font-medium py-2.5 rounded-xl transition">
                                ดูรายละเอียดเพิ่มเติม
                            </button>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // Filter Function
        function filterDorms() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const selectedZone = document.getElementById('zoneFilter').value;
            const selectedGender = document.getElementById('genderFilter').value;

            const filtered = dorms.filter(dorm => {
                const matchesSearch = dorm.name.toLowerCase().includes(searchText) || dorm.zone.toLowerCase().includes(searchText);
                const matchesZone = selectedZone === 'all' || dorm.zone === selectedZone;
                const matchesGender = selectedGender === 'all' || dorm.gender === selectedGender;

                return matchesSearch && matchesZone && matchesGender;
            });

            renderDorms(filtered);
        }

        // Modal Controls
        function openModal(id) {
            const dorm = dorms.find(d => d.id === id);
            if(!dorm) return;

            document.getElementById('modalImg').src = dorm.image;
            document.getElementById('modalTitle').innerText = dorm.name;
            document.getElementById('modalZone').querySelector('span').innerText = `โซน${dorm.zone} (รอบ ม.อ.ปัตตานี)`;
            document.getElementById('modalPrice').innerText = `฿${dorm.price} / เดือน`;
            document.getElementById('modalGenderBadge').innerText = `หอพัก${dorm.gender}`;
            
            const facContainer = document.getElementById('modalFacilities');
            facContainer.innerHTML = dorm.facilities.map(f => `<span class="bg-blue-50 text-blue-700 text-xs px-2.5 py-1 rounded-md border border-blue-100"><i class="fa-solid fa-check mr-1 text-green-500"></i>${f}</span>`).join('');

            document.getElementById('modalCall').href = `tel:${dorm.phone}`;
            document.getElementById('modalLine').href = dorm.line;

            document.getElementById('dormModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('dormModal').classList.add('hidden');
        }

        // Initial Render
        renderDorms(dorms);
    </script>
</body>
</html>
